name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'  # Déclenchement quand un tag versionné est poussé, ex: v1.0.0

# Trusted Publishing (OIDC) — matches nuget.org policy for
# owner AnthonyChaussin / repo DriveClient / workflow nuget-publish.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet/login OIDC exchange

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🛠️ Build
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run tests
        run: dotnet test --no-build --configuration Release

      - name: 📦 Pack NuGet
        run: dotnet pack --configuration Release --no-build --output ./nupkgs

      - name: 🔑 NuGet login (OIDC → temporary API key)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name (not email)
          user: AnthonyChaussin

      - name: 🚀 Publish to NuGet
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
